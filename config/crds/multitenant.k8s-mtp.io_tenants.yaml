apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.multitenant.k8s-mtp.io
spec:
  group: multitenant.k8s-mtp.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
    shortNames:
      - tn
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - tier
                - ownerEmail
              properties:
                name:
                  type: string
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                tier:
                  type: string
                  enum: ["free", "pro", "enterprise"]
                ownerEmail:
                  type: string
                  format: email
                admins:
                  type: array
                  items:
                    type: string
                  description: "List of IDs with admin privileges"
                operators:
                  type: array
                  items:
                    type: string
                  description: "List of IDs with operator privileges"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Creating", "Active", "Failed", "Deleting"]
                namespace:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
